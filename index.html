<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1014">
<!-- تشغيل كتطبيق مستقل على iOS: من غير شريط سفاري -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سجل الجيم">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>سجل الجيم</title>
<style>
/* ============================================================
   الألوان مأخوذة من أقراص الأولمبيك القياسية (IWF)
   25 أحمر • 20 أزرق • 15 أصفر • 10 أخضر • 5 أبيض
   ============================================================ */
:root{
  --bg:#0D1014; --bg2:#12161B;
  --panel:#171C22; --panel2:#1E242C; --panel3:#28303A; --panel4:#333C48;
  --line:#252C35; --line2:#323B46;
  --ink:#F0F4F8; --ink2:#98A4B2; --ink3:#69747F;
  --accent:#F0BE18; --accentDim:#8A6E0C;
  --ok:#31A05B; --pr:#E03B34; --blue:#4A8DE0;
  --p25:#D6312B; --p20:#1D63C4; --p15:#E8B613; --p10:#2E8B4F;
  --p5:#E4E7EB; --p2:#39424D; --p1:#8A939E;
  --r:16px; --r2:12px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI","Noto Sans Arabic",sans-serif;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;background:
    radial-gradient(120% 60% at 50% -10%, #1A2129 0%, transparent 60%), var(--bg);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-bottom:calc(96px + var(--sab));
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;
  transition:transform .12s var(--ease),background .15s,opacity .15s}
button:active{transform:scale(.955)}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* ---------- الهيدر ---------- */
header{position:sticky;top:0;z-index:40;
  background:rgba(13,16,20,.82);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);padding:calc(9px + var(--sat)) 14px 9px}
.hrow{display:flex;align-items:center;gap:10px}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{font-size:12px;color:var(--ink3);font-weight:400;margin-top:1px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel2);
  display:grid;place-items:center;font-size:17px;flex:none;border:1px solid var(--line2)}
.iconbtn.go{background:var(--accent);color:#14161A;border-color:transparent;font-weight:800}

/* ---------- تايمر الراحة (حلقة) ---------- */
#rest{display:none;margin-top:10px;background:var(--panel);border:1px solid var(--line2);
  border-radius:var(--r);padding:11px 13px;align-items:center;gap:14px}
#rest.on{display:flex}
#rest.ready{border-color:var(--ok);background:#14261B}
.ring{width:58px;height:58px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .trk{stroke:var(--panel3)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
#rest.ready .ring .bar{stroke:var(--ok)}
.ringtxt{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.restmid{flex:1;min-width:0}
.restlbl{font-size:13px;color:var(--ink2);font-weight:600}
.restex{font-size:11.5px;color:var(--ink3);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rsm{font-size:13px;color:var(--ink2);background:var(--panel3);padding:8px 12px;
  border-radius:10px;flex:none;font-weight:600}

main{padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--ink3);font-weight:800;margin:24px 3px 10px}
.eyebrow:first-child{margin-top:2px}

/* ---------- اختيار اليوم ---------- */
.day{display:flex;align-items:center;gap:12px;padding:16px 14px;width:100%;
  text-align:right;border-bottom:1px solid var(--line);position:relative}
.day:last-child{border-bottom:0}
.day.next{background:linear-gradient(90deg,rgba(240,190,24,.09),transparent)}
.day.next::before{content:"";position:absolute;right:0;top:12px;bottom:12px;width:3px;
  background:var(--accent);border-radius:0 3px 3px 0}
.dayname{flex:1;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.daymeta{font-size:12.5px;color:var(--ink3);font-weight:400;margin-top:3px}
.chev{color:var(--ink3);font-size:19px;flex:none}
.dnum{width:38px;height:38px;border-radius:12px;background:var(--panel3);display:grid;
  place-items:center;font-family:var(--mono);font-size:15px;font-weight:800;color:var(--accent);flex:none}
.day.next .dnum{background:var(--accent);color:#14161A}
.pill{font-size:10.5px;background:var(--accent);color:#14161A;padding:2px 8px;
  border-radius:6px;font-weight:800;flex:none}

/* ---------- بطاقة التمرين ---------- */
.ex{border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.exhead{display:flex;align-items:center;gap:11px;padding:12px 14px;width:100%;text-align:right}
.exhead:active{background:var(--panel2)}
.exname{flex:1;font-weight:650;min-width:0;font-size:15.5px;letter-spacing:-.01em}
.exlast{font-family:var(--mono);font-size:12.5px;color:var(--ink3);margin-top:3px;
  font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--panel3);flex:none}
.dot.part{background:var(--accent)}
.dot.full{background:var(--ok)}
.exbody{display:none;padding:0 14px 15px}
.ex.open{background:var(--bg2)}
.ex.open .exbody{display:block}

/* ---------- صور ---------- */
.thumb{width:44px;height:44px;border-radius:11px;background:#fff;object-fit:contain;flex:none;padding:2px}
.figs{display:flex;gap:8px;overflow-x:auto;margin:2px 0 12px;padding-bottom:2px;
  -webkit-overflow-scrolling:touch}
.fig{height:150px;background:#fff;border-radius:12px;object-fit:contain;flex:none;
  padding:5px;cursor:zoom-in;max-width:100%}
.figs.one .fig{width:100%;height:auto;max-height:158px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(6,8,10,.96);display:none;
  align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:86vh;background:#fff;border-radius:14px;padding:8px}

/* ---------- صفوف السِتات ---------- */
.setrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.setrow:last-of-type{border-bottom:0}
.sidx{width:27px;height:27px;border-radius:9px;background:var(--panel3);display:grid;
  place-items:center;font-family:var(--mono);font-size:12px;color:var(--ink2);flex:none;font-weight:700}
.setrow.done .sidx{background:var(--ok);color:#fff}
.sval{font-family:var(--mono);font-size:16px;flex:1}
.sval .u{font-size:11.5px;color:var(--ink3);font-family:var(--sans)}
.setrow.ghost{opacity:.4}
.prtag{font-size:10.5px;background:var(--pr);color:#fff;padding:3px 8px;border-radius:6px;
  font-weight:800;flex:none}
.xbtn{color:var(--ink3);font-size:20px;padding:2px 8px;flex:none}

/* ---------- اقتراح التقدم ---------- */
.sugg{display:flex;align-items:center;gap:10px;line-height:1.6;background:linear-gradient(90deg,rgba(240,190,24,.13),rgba(240,190,24,.03));
  border:1px solid var(--accentDim);border-radius:12px;padding:10px 12px;margin:11px 0 0;font-size:13.5px}
.sugg b{color:var(--accent)}
.sugg button{background:var(--accent);color:#14161A;font-weight:800;font-size:12.5px;
  padding:7px 12px;border-radius:9px;flex:none}

/* ---------- المدخلات ---------- */
.pad{margin-top:12px;background:var(--panel2);border-radius:14px;padding:13px;border:1px solid var(--line)}
.padlbl{font-size:11.5px;color:var(--ink3);margin-bottom:7px;font-weight:700;letter-spacing:.03em}
.step{display:flex;align-items:center;gap:9px}
.step>*{min-width:0}
.sbtn{width:56px;height:56px;border-radius:14px;background:var(--panel3);font-size:26px;
  font-weight:500;display:grid;place-items:center;flex:none;border:1px solid var(--line2)}
.sbtn:active{background:var(--panel4)}
.sin{flex:1;height:56px;background:var(--bg);border:1px solid var(--line2);border-radius:14px;
  text-align:center;font-family:var(--mono);font-size:27px;font-weight:700;
  font-variant-numeric:tabular-nums;min-width:0}
.sin::-webkit-outer-spin-button,.sin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sin[type=number]{-moz-appearance:textfield}
.grid2{display:grid;grid-template-columns:1fr;gap:13px}
.grid2>*{min-width:0}
@media(min-width:540px){.grid2{grid-template-columns:1fr 1fr}}
.btn{width:100%;height:52px;border-radius:14px;font-weight:800;font-size:15.5px;
  display:grid;place-items:center;margin-top:11px;letter-spacing:-.01em}
.btn.main{background:var(--accent);color:#14161A;box-shadow:0 3px 14px rgba(240,190,24,.16)}
.btn.ghost{background:var(--panel3);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{height:44px;font-size:14px;margin-top:9px;font-weight:700}
.btn:disabled{opacity:.4}

/* ---------- أقراص + إحماء ---------- */
.plates{display:flex;align-items:center;gap:3px;margin-top:11px;padding:9px 11px;
  background:var(--bg);border-radius:11px;min-height:46px;overflow-x:auto;border:1px solid var(--line)}
.bar{height:4px;background:var(--p1);border-radius:2px;flex:none;width:16px}
.pl{border-radius:2px;flex:none;width:12px;display:grid;place-items:end center;padding-bottom:2px;
  font-family:var(--mono);font-size:8.5px;font-weight:800;color:#000;line-height:1}
.plnote{font-size:12px;color:var(--ink3);white-space:nowrap;flex:none;margin-left:6px}
details.warm{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;font-size:13.5px}
details.warm summary{cursor:pointer;color:var(--ink2);font-weight:700;font-size:13px;list-style:none}
details.warm summary::-webkit-details-marker{display:none}
details.warm summary::before{content:"🔥 ";}
.wrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:13.5px}
.wrow:last-child{border-bottom:0}
.wrow span{color:var(--ink3);font-family:var(--sans);font-size:12px}

/* ---------- ملاحظات ---------- */
.note{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;margin-top:10px;font-size:14px;min-height:44px;resize:vertical;line-height:1.6}

/* ---------- إحصائيات ---------- */
.stat{display:flex;gap:9px;margin-top:11px}
.statbox{flex:1;background:var(--panel2);border-radius:12px;padding:12px;border:1px solid var(--line)}
.statval{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.03em}
.statlbl{font-size:11px;color:var(--ink3);margin-top:3px}
.chart{width:100%;height:150px;display:block}

/* ---------- السجل ---------- */
.hs{padding:14px;border-bottom:1px solid var(--line)}
.hs:last-child{border-bottom:0}
.hsh{display:flex;align-items:baseline;gap:9px}
.hsd{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-right:auto}
.hsl{font-size:13px;color:var(--ink2);font-family:var(--mono);margin-top:5px;line-height:1.7}
.week{display:flex;gap:5px;margin-top:11px}
.wd{flex:1;height:34px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;
  font-size:11px;color:var(--ink3);border:1px solid var(--line)}
.wd.hit{background:var(--ok);color:#fff;border-color:transparent;font-weight:700}

/* ---------- الشيت (ملخص التمرين) ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(6,8,10,.6);display:none;
  align-items:flex-end;backdrop-filter:blur(4px)}
.sheet.on{display:flex}
.sheetin{width:100%;background:var(--panel);border-radius:22px 22px 0 0;padding:8px 18px calc(24px + var(--sab));
  border-top:1px solid var(--line2);animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;background:var(--panel4);border-radius:2px;margin:0 auto 16px}
.big3{display:flex;gap:9px;margin:14px 0}
.big3 div{flex:1;text-align:center;background:var(--panel2);border-radius:13px;padding:14px 6px;
  border:1px solid var(--line)}
.big3 b{display:block;font-family:var(--mono);font-size:23px;font-weight:800;letter-spacing:-.03em}
.big3 span{font-size:11px;color:var(--ink3)}

/* ---------- المحرر ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:7px;font-weight:700}
.field input,.field select,.field textarea{width:100%;background:var(--bg);
  border:1px solid var(--line2);border-radius:12px;padding:13px}
.field textarea{min-height:200px;font-family:var(--mono);font-size:13.5px;line-height:1.85;resize:vertical}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.7;margin-top:8px}
.edrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.edrow:last-child{border-bottom:0}
.edname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.tag{font-size:10.5px;background:var(--panel3);color:var(--ink2);padding:3px 8px;border-radius:6px;flex:none}

/* ---------- التنقل ---------- */
nav{position:fixed;bottom:0;right:0;left:0;z-index:40;
  background:rgba(13,16,20,.9);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab)}
nav button{flex:1;padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;
  color:var(--ink3);font-size:10.5px;font-weight:600}
nav button.on{color:var(--accent)}
nav .ic{font-size:21px;line-height:1;filter:grayscale(1) opacity(.75)}
nav button.on .ic{filter:none}

.empty{text-align:center;padding:46px 22px;color:var(--ink3)}
.empty .big{font-size:42px;margin-bottom:12px;opacity:.45}
.page{display:none}
.page.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.toast{position:fixed;bottom:calc(88px + var(--sab));right:50%;transform:translateX(50%);
  background:var(--panel3);border:1px solid var(--line2);padding:12px 20px;border-radius:13px;
  font-size:14px;z-index:95;opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:88vw;text-align:center;font-weight:600}
.toast.on{opacity:1}
.warn{background:#2A2010;border:1px solid #5C4712;color:#E8C86A;padding:12px 14px;
  border-radius:12px;font-size:13px;margin-bottom:12px;line-height:1.65}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button class="iconbtn" id="backBtn" style="display:none" aria-label="رجوع">→</button>
    <div class="htitle"><b id="hTitle">سجل الجيم</b><div class="hsub" id="hSub">اختار يوم التمرين</div></div>
    <button class="iconbtn go" id="finishBtn" style="display:none" aria-label="إنهاء التمرين">✓</button>
  </div>
  <div id="rest">
    <div class="ring">
      <svg width="58" height="58" viewBox="0 0 58 58">
        <circle class="trk" cx="29" cy="29" r="24" fill="none" stroke-width="5"/>
        <circle class="bar" id="rtBar" cx="29" cy="29" r="24" fill="none" stroke-width="5"
                stroke-dasharray="150.8" stroke-dashoffset="0"/>
      </svg>
      <div class="ringtxt num" id="rtTime">1:30</div>
    </div>
    <div class="restmid">
      <div class="restlbl" id="rtLbl">راحة</div>
      <div class="restex" id="rtEx"></div>
    </div>
    <button class="rsm" id="rtAdd">+30</button>
    <button class="rsm" id="rtStop">تخطي</button>
  </div>
</header>

<main>
  <div class="page on" id="pgWorkout"></div>
  <div class="page" id="pgHistory"></div>
  <div class="page" id="pgProgram"></div>
  <div class="page" id="pgSettings"></div>
</main>

<nav>
  <button class="on" data-pg="Workout"><span class="ic">🏋️</span>التمرين</button>
  <button data-pg="History"><span class="ic">📈</span>السجل</button>
  <button data-pg="Program"><span class="ic">📋</span>البرنامج</button>
  <button data-pg="Settings"><span class="ic">⚙️</span>الإعدادات</button>
</nav>

<div class="lb" id="lb"><img id="lbImg" alt=""></div>
<div class="sheet" id="sheet"><div class="sheetin" id="sheetIn"></div></div>
<noscript><div style="padding:24px;color:#F0F4F8;font-family:sans-serif;line-height:1.8">
<b style="font-size:19px">الجافاسكريبت مقفول</b><br>الأداة محتاجة الجافاسكريبت يشتغل.<br>
في سفاري: الإعدادات ← سفاري ← متقدم ← JavaScript ← شغّله.</div></noscript>
<div id="fatal" style="display:none;position:fixed;inset:0;z-index:999;background:#0D1014;
  color:#F0F4F8;font-family:sans-serif;padding:24px;overflow:auto;line-height:1.7;direction:rtl">
  <div style="font-size:34px">⚠️</div>
  <b style="font-size:18px">حصل خطأ منع الأداة من الاشتغال</b>
  <p style="color:#98A4B2;font-size:14px">صوّر الشاشة دي وابعتها.</p>
  <pre id="fatalMsg" style="background:#171C22;border:1px solid #323B46;border-radius:12px;
    padding:14px;white-space:pre-wrap;word-break:break-word;font-size:12.5px;direction:ltr;text-align:left"></pre>
  <div id="fatalEnv" style="background:#171C22;border:1px solid #323B46;border-radius:12px;
    padding:14px;font-size:12px;direction:ltr;text-align:left;color:#98A4B2;margin-top:10px"></div>
</div>
<script>
window.addEventListener("error", function(e){
  var b=document.getElementById("fatal"); if(!b) return;
  b.style.display="block";
  document.getElementById("fatalMsg").textContent =
    (e.message||"error") + "\n" + (e.filename||"") + " : line " + (e.lineno||"?");
  var st=""; try{ localStorage.setItem("x","1"); localStorage.removeItem("x"); st="ok"; }
  catch(err){ st="BLOCKED — " + err.name; }
  document.getElementById("fatalEnv").textContent =
    "storage: "+st+"\nprotocol: "+location.protocol+"\nUA: "+navigator.userAgent;
});
</script>
<div class="toast" id="toast"></div>

/* ============================================================
   التخزين
   ============================================================ */
const mem = {};
let storageOK = true;
try { localStorage.setItem("gym:t","1"); localStorage.removeItem("gym:t"); }
catch(e){ storageOK = false; }

const DB = {
  get(k,d){ try{ const v = storageOK ? localStorage.getItem(k) : mem[k];
                 return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ const s = JSON.stringify(v);
    try{ if(storageOK) localStorage.setItem(k,s); else mem[k]=s; }
    catch(e){ storageOK=false; mem[k]=s; toast("مساحة التخزين اتملت — اعمل نسخة احتياطية"); } }
};

let program  = DB.get("gym:program", null);
let sessions = DB.get("gym:sessions", []);
let settings = DB.get("gym:settings", {rest:90,bar:20,smithBar:15,beep:true,step:2.5,awake:true});
let notes    = DB.get("gym:notes", {});
let live     = DB.get("gym:live", null);
let openEx = null, page = "Workout", chartEx = null;

if (settings.smithBar == null) settings.smithBar = 15;
if (settings.step == null)     settings.step = 2.5;
if (settings.awake == null)    settings.awake = true;
if (!program) program = JSON.parse(JSON.stringify(COACH_PROGRAM));

const save = () => { DB.set("gym:program",program); DB.set("gym:sessions",sessions);
  DB.set("gym:settings",settings); DB.set("gym:live",live); DB.set("gym:notes",notes); };

   أدوات
   ============================================================ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const round = n => Math.round(n*100)/100;
const e1rm = (w,r) => r>0 ? w*(1+r/30) : 0;

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("on"),2200); }
function fmtDate(iso){
  const diff = Math.floor((new Date().setHours(0,0,0,0) - new Date(iso).setHours(0,0,0,0))/86400000);
  if(diff===0) return "النهارده"; if(diff===1) return "امبارح";
  if(diff<7) return "من "+diff+" أيام";
  return new Date(iso).toLocaleDateString("ar-EG",{day:"numeric",month:"short"});
}
const daysAgo = iso => Math.floor((Date.now()-new Date(iso).getTime())/86400000);

function historyOf(n){ const o=[];
  for(let i=sessions.length-1;i>=0;i--){ const e=sessions[i].entries.find(x=>x.exName===n);
    if(e&&e.sets.length) o.push({date:sessions[i].date, sets:e.sets}); } return o; }
const lastOf = n => historyOf(n)[0] || null;
function bestOf(n){ let b=0,bw=0,br=0;
  historyOf(n).forEach(s=>s.sets.forEach(t=>{const e=e1rm(t.w,t.r); if(e>b){b=e;bw=t.w;br=t.r;}}));
  return b?{e1rm:b,w:bw,r:br}:null; }
const setsLine = s => s.map(x=>x.w+"×"+x.r).join("  ·  ");
const volOf = s => s.reduce((a,x)=>a+x.w*x.r,0);

/* ============================================================
   iOS: فتح الصوت + منع الشاشة من النوم
   ============================================================ */
let AC = null;
function unlockAudio(){
  try{
    if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)();
      const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
      s.buffer=b; s.connect(AC.destination); s.start(0); }
    if(AC.state==="suspended") AC.resume();
  }catch(e){}
}
document.addEventListener("touchend", unlockAudio, {passive:true});
document.addEventListener("click", unlockAudio);

function beep(){
  if(!settings.beep || !AC) return;
  try{ [0,.2,.4].forEach(t=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination); o.type="sine"; o.frequency.value=t<.4?880:1180;
    g.gain.setValueAtTime(.0001,AC.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.35,AC.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.16);
    o.start(AC.currentTime+t); o.stop(AC.currentTime+t+.18);
  }); }catch(e){}
}

let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && settings.awake && "wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock=null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible"){ if(live) keepAwake(true); if(rest.tick) paintRest(); }
});

/* ============================================================
   الأقراص والإحماء
   ============================================================ */
const PLATES=[{w:25,c:"var(--p25)",h:42},{w:20,c:"var(--p20)",h:39},{w:15,c:"var(--p15)",h:35},
 {w:10,c:"var(--p10)",h:30},{w:5,c:"var(--p5)",h:25},{w:2.5,c:"var(--p2)",h:20},{w:1.25,c:"var(--p1)",h:16}];
const barOf = ex => (ex && ex.bar==="smith") ? (settings.smithBar||15) : (settings.bar||20);

function plateSplit(total, barW){
  const B = barW==null ? settings.bar : barW;
  let side=(total-B)/2; if(side<=0) return null;
  const out=[]; for(const p of PLATES){ while(side>=p.w-0.001){ out.push(p); side=round(side-p.w); } }
  return {plates:out, left:round(side)};
}
function platesHTML(total, barW){
  const B = barW==null ? settings.bar : barW;
  const s = plateSplit(total,B);
  if(!s) return `<div class="plates"><span class="plnote">البار لوحده أو أقل (${B} كجم)</span></div>`;
  const pl = s.plates.map(p=>`<div class="pl" style="background:${p.c};height:${p.h}px">${p.w<5?"":p.w}</div>`).join("");
  return `<div class="plates"><span class="plnote">كل ناحية:</span>${pl}<div class="bar"></div>`
       + (s.left>0?`<span class="plnote">باقي ${s.left} مش مظبوطة</span>`:"")+`</div>`;
}
function warmupHTML(work, barW){
  if(!work || work<=barW) return "";
  const rows=[[barW,10],[round(work*.5/2.5)*2.5,5],[round(work*.7/2.5)*2.5,3],[round(work*.9/2.5)*2.5,1]]
    .filter((r,i)=>i===0||r[0]>barW);
  return `<details class="warm"><summary>سِتات الإحماء قبل ${work} كجم</summary>` +
    rows.map((r,i)=>`<div class="wrow"><b>${r[0]} كجم × ${r[1]}</b><span>${
      i===0?"البار فاضي":Math.round(r[0]/work*100)+"% من وزن الشغل"}</span></div>`).join("") +
    `</details>`;
}

/* ============================================================
   اقتراح زيادة الوزن
   ============================================================ */
function suggestion(ex){
  const prev = lastOf(ex.name); if(!prev) return null;
  const target = ex.reps || 12, need = ex.sets || 4;
  const allHit = prev.sets.length >= need && prev.sets.every(s=>s.r >= target);
  if(!allHit) return null;
  const w = Math.max(...prev.sets.map(s=>s.w));
  const inc = ex.type==="dumbbell" ? 2 : (settings.step||2.5);
  return { from:w, to:round(w+inc), reps:target, sets:need };
}

const RC = 2*Math.PI*24;
let rest = {end:0,total:0,tick:null,ex:""};
function startRest(sec, exName){
  rest.total=sec; rest.end=Date.now()+sec*1000; rest.ex=exName||"";
  $("#rest").classList.add("on"); $("#rest").classList.remove("ready");
  $("#rtEx").textContent = rest.ex;
  clearInterval(rest.tick); rest.tick=setInterval(paintRest,250); paintRest();
}
function paintRest(){
  const left=Math.max(0,Math.round((rest.end-Date.now())/1000));
  $("#rtTime").textContent = Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("#rtBar").style.strokeDashoffset = RC*(1-(rest.total?left/rest.total:0));
  if(left<=0){
    clearInterval(rest.tick); rest.tick=null;
    $("#rest").classList.add("ready"); $("#rtTime").textContent="✓";
    $("#rtLbl").textContent="جاهز للسِت الجاي";
    beep(); if(navigator.vibrate) navigator.vibrate([180,90,180]);
  } else $("#rtLbl").textContent="راحة";
}
function stopRest(){ clearInterval(rest.tick); rest.tick=null; $("#rest").classList.remove("on","ready"); }
$("#rtStop").onclick = stopRest;
$("#rtAdd").onclick = () => { rest.end+=30000; rest.total+=30; $("#rest").classList.remove("ready");
  if(!rest.tick) rest.tick=setInterval(paintRest,250); paintRest(); };

/* ---------------- اليوم المقترح ---------------- */
function nextDayId(){
  if(!program.days.length) return null;
  const last = sessions[sessions.length-1];
  if(!last) return program.days[0].id;
  const i = program.days.findIndex(d=>d.id===last.dayId);
  return program.days[(i+1) % program.days.length].id;
}
function weekStrip(){
  const names=["ح","ن","ث","ر","خ","ج","س"];
  const now=new Date(), dow=now.getDay();
  const start=new Date(now); start.setDate(now.getDate()-dow); start.setHours(0,0,0,0);
  const hit=new Set(sessions.map(s=>new Date(s.date).setHours(0,0,0,0)));
  return `<div class="week">`+names.map((n,i)=>{
    const d=new Date(start); d.setDate(start.getDate()+i);
    return `<div class="wd ${hit.has(d.getTime())?"hit":""}">${n}</div>`;
  }).join("")+`</div>`;
}

function chartSVG(name){
  const h=historyOf(name).slice().reverse();
  const pts=h.map(x=>({v:Math.max(...x.sets.map(s=>s.w))}));
  if(pts.length<2) return `<div class="empty" style="padding:26px">محتاج تمرينين على الأقل عشان يرسم خط.</div>`;
  const W=320,H=150,pad=26;
  const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), rg=(mx-mn)||1;
  const X=i=>pad+i*(W-pad*2)/(pts.length-1), Y=v=>H-pad-((v-mn)/rg)*(H-pad*2);
  const line=pts.map((p,i)=>`${X(i)},${Y(p.v)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      role="img" aria-label="تطور الوزن في ${esc(name)}">
    <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${pad},${H-pad} ${line} ${W-pad},${H-pad}" fill="url(#gr)"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.4" fill="var(--accent)"/>`).join("")}
    <text x="${pad-5}" y="${Y(mx)+4}" fill="var(--ink3)" font-size="10" text-anchor="end" font-family="monospace">${round(mx)}</text>
    <text x="${pad-5}" y="${Y(mn)+4}" fill="var(--ink3)" font-size="10" text-anchor="end" font-family="monospace">${round(mn)}</text>
  </svg>
  <div class="stat">
    <div class="statbox"><div class="statval num">${round(mx)}</div><div class="statlbl">أعلى وزن</div></div>
    <div class="statbox"><div class="statval num">${pts.length}</div><div class="statlbl">عدد المرات</div></div>
    <div class="statbox"><div class="statval num">${round(pts[pts.length-1].v-pts[0].v)}</div>
      <div class="statlbl">الفرق من البداية</div></div></div>`;
}

function importProgram(){
  const txt=$("#impText").value.trim(); if(!txt) return toast("اكتب البرنامج الأول");
  const days=[]; let cur=null;
  txt.split("\n").forEach(raw=>{
    const l=raw.trim(); if(!l) return;
    if(l.startsWith("#")||/^(يوم|day)\s*[:：]?/i.test(l)){
      cur={id:uid(),name:l.replace(/^#+\s*/,"").replace(/^(يوم|day)\s*[:：]?\s*/i,"").trim()||("يوم "+(days.length+1)),exercises:[]};
      days.push(cur); return;
    }
    if(!cur){ cur={id:uid(),name:"يوم 1",exercises:[]}; days.push(cur); }
    const m=l.match(/^(.*?)[\s\-–—]*(\d+)\s*[x×*]\s*(\d+)\s*$/);
    const name=(m?m[1]:l).replace(/[\s\-–—:]+$/,"").trim(); if(!name) return;
    const bb=/بار|باربل|سكوات|سكوت|ديدلفت|بنش|رفعة ميتة|barbell|squat|deadlift|bench/i.test(name);
    const bw=/عقلة|متوازي|بلانك|pull.?up|chin.?up|dip|push.?up|plank|هايبر/i.test(name);
    const db=/دمبل|dumbbell/i.test(name);
    cur.exercises.push({id:uid(),name,sets:m?+m[2]:3,reps:m?+m[3]:10,
      type: bw?"bodyweight":bb?"barbell":db?"dumbbell":"machine", bar: bb?"bar":undefined});
  });
  const t=days.reduce((n,d)=>n+d.exercises.length,0);
  if(!t) return toast("مقدرتش أقرا أي تمرين — راجع الصيغة");
  program={days:days.filter(d=>d.exercises.length)}; save();
  toast(`اتسجّل ${program.days.length} يوم و${t} تمرين`); page="Workout"; render();
}

/* ---------------- الإعدادات ---------------- */
function renderSettings(){
  $("#hTitle").textContent="الإعدادات"; $("#hSub").textContent="النسخ الاحتياطي والتفضيلات";
  $("#backBtn").style.display="none"; $("#finishBtn").style.display="none";
  const standalone = window.navigator.standalone || matchMedia("(display-mode:standalone)").matches;

  $("#pgSettings").innerHTML =
   (!storageOK?`<div class="warn">المتصفح مش سامح بالتخزين هنا، فالبيانات هتضيع لما تقفل الصفحة.
      افتح الملف من جهازك مباشرة عشان يشتغل الحفظ.</div>`:"") +
   (!standalone?`<div class="warn"><b>نصيحة للآيفون:</b> من سفاري دوس زرار المشاركة ⬆️ ثم
      «إضافة إلى الشاشة الرئيسية». هتفتح كتطبيق كامل من غير شريط سفاري، والصوت ومنع نوم الشاشة
      هيشتغلوا أحسن.</div>`:"") +
   `<div class="eyebrow">التمرين</div><div class="card" style="padding:14px">
      <div class="field"><label>مدة الراحة بين السِتات (ثانية)</label>
        <input type="number" id="stRest" value="${settings.rest}" min="10" step="15"></div>
      <div class="field"><label>خطوة زيادة الوزن المقترحة (كجم)</label>
        <input type="number" id="stStep" value="${settings.step}" step="0.5">
        <div class="hint">الأداة بتقترح الزيادة دي لما تكمّل كل سِتاتك بالتكرارات المطلوبة.
        الدمبل بيزيد 2 كجم تلقائيًا.</div></div>
      <div class="field"><label>وزن البار الأولمبي الفاضي (كجم)</label>
        <input type="number" id="stBar" value="${settings.bar}" step="0.5"></div>
      <div class="field"><label>وزن بار السميث الفاضي (كجم)</label>
        <input type="number" id="stSmith" value="${settings.smithBar}" step="0.5">
        <div class="hint">بار السميث متعوّض بأثقال فوزنه أقل من الأولمبي. ارفعه فاضي مرة واحدة
        واعرف وزنه وحطه هنا — بيستخدم في سكوات السميث بس.</div></div>
      <div class="field"><label>صوت آخر الراحة</label>
        <select id="stBeep"><option value="1" ${settings.beep?"selected":""}>شغّال</option>
        <option value="0" ${!settings.beep?"selected":""}>مقفول</option></select></div>
      <div class="field"><label>منع الشاشة من النوم أثناء التمرين</label>
        <select id="stAwake"><option value="1" ${settings.awake?"selected":""}>شغّال</option>
        <option value="0" ${!settings.awake?"selected":""}>مقفول</option></select></div>
      <button class="btn main" onclick="saveSettings()">احفظ الإعدادات</button></div>

    <div class="eyebrow">نسخة احتياطية</div><div class="card" style="padding:14px">
      <div class="hint" style="margin-top:0">بياناتك متخزّنة في المتصفح بس. لو مسحت بيانات التصفح
      هتروح، فنزّل نسخة كل فترة.</div>
      <button class="btn main" onclick="exportData()">نزّل نسخة احتياطية</button>
      <button class="btn ghost sm" onclick="document.getElementById('impFile').click()">ارجع من نسخة محفوظة</button>
      <input type="file" id="impFile" accept=".json" style="display:none">
      <div class="hint">${sessions.length} تمرين · ${program?program.days.length:0} يوم في البرنامج</div></div>

    <div class="eyebrow">منطقة الخطر</div><div class="card" style="padding:14px">
      <button class="btn ghost" style="color:var(--pr)" onclick="wipe()">امسح كل البيانات</button></div>`;

  $("#impFile").onchange = e => {
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(d.program) program=d.program; if(d.sessions) sessions=d.sessions;
      if(d.notes) notes=d.notes; if(d.settings) settings=Object.assign(settings,d.settings);
      save(); toast("النسخة رجعت"); render();
    }catch(err){ toast("الملف مش مقروء"); } };
    r.readAsText(f);
  };
}
function saveSettings(){
  settings.rest=Math.max(10,+$("#stRest").value||90);
  settings.step=+$("#stStep").value||2.5;
  settings.bar=+$("#stBar").value||20;
  settings.smithBar=+$("#stSmith").value||15;
  settings.beep=$("#stBeep").value==="1";
  settings.awake=$("#stAwake").value==="1";
  save(); toast("الإعدادات اتحفظت");
}
function exportData(){
  const blob=new Blob([JSON.stringify({program,sessions,settings,notes,saved:new Date().toISOString()},null,2)],
    {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="gym-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href); toast("النسخة نزلت");
}
function wipe(){
  if(!confirm("هيتمسح البرنامج وكل التمارين المسجّلة. متأكد؟")) return;
  program=JSON.parse(JSON.stringify(COACH_PROGRAM)); sessions=[]; live=null; notes={};
  save(); toast("اتمسح كل حاجة"); render();
}

/* ============================================================
   الأفعال
   ============================================================ */
function go(p){ page=p; render(); window.scrollTo(0,0); }
function startDay(id){
  const d=program.days.find(x=>x.id===id);
  live={id:uid(),dayId:d.id,dayName:d.name,date:new Date().toISOString(),entries:[]};
  openEx=d.exercises[0]?d.exercises[0].id:null;
  save(); keepAwake(true); render();
}
function toggleEx(id){ openEx = openEx===id?null:id; renderWorkout(); }
function setW(v){ const i=$("#inW"); if(i){ i.value=v; i.dispatchEvent(new Event("input")); } }
function bump(which,dir){
  const el=$(which==="w"?"#inW":"#inR"), st=which==="w"?2.5:1;
  el.value=round(Math.max(0,(+el.value||0)+dir*st));
  el.dispatchEvent(new Event("input"));
}
function saveNote(name,val){ if(val.trim()) notes[name]=val.trim(); else delete notes[name]; save(); }
function addSet(exId){
  const w=+$("#inW").value||0, r=+$("#inR").value||0;
  if(r<=0) return toast("حط عدد التكرارات");
  const day=program.days.find(d=>d.id===live.dayId), ex=day.exercises.find(e=>e.id===exId);
  let en=live.entries.find(e=>e.exId===exId);
  if(!en){ en={exId,exName:ex.name,sets:[]}; live.entries.push(en); }
  const best=bestOf(ex.name);
  en.sets.push({w,r});
  save(); startRest(settings.rest, ex.name); renderWorkout();
  if(best && e1rm(w,r)>best.e1rm) toast("رقم شخصي جديد 🔥");
}
function delSet(exId,i){
  const en=live.entries.find(e=>e.exId===exId); if(!en) return;
  en.sets.splice(i,1);
  if(!en.sets.length) live.entries=live.entries.filter(e=>e.exId!==exId);
  save(); renderWorkout();
}
function repeatLast(exId){
  const day=program.days.find(d=>d.id===live.dayId), ex=day.exercises.find(e=>e.id===exId);
  const prev=lastOf(ex.name); if(!prev) return;
  let en=live.entries.find(e=>e.exId===exId);
  if(!en){ en={exId,exName:ex.name,sets:[]}; live.entries.push(en); }
  en.sets=prev.sets.map(s=>({w:s.w,r:s.r}));
  save(); renderWorkout(); toast("اتنقل "+en.sets.length+" سِت");
}
function finishWorkout(){
  if(!live) return;
  live.entries=live.entries.filter(e=>e.sets.length);
  if(!live.entries.length){ live=null; save(); stopRest(); keepAwake(false); render();
    return toast("مفيش سِتات اتسجّلت"); }

  const prs=[];
  live.entries.forEach(e=>{
    const before = historyOf(e.exName);
    let b=0; before.forEach(s=>s.sets.forEach(t=>{ const v=e1rm(t.w,t.r); if(v>b) b=v; }));
    const now=Math.max(...e.sets.map(s=>e1rm(s.w,s.r)));
    if(now>b+.01) prs.push(e.exName);
  });
  const sets=live.entries.reduce((a,e)=>a+e.sets.length,0);
  const vol=live.entries.reduce((a,e)=>a+volOf(e.sets),0);
  const mins=Math.max(1,Math.round((Date.now()-new Date(live.date))/60000));
  const dayName=live.dayName;

  sessions.push(live); live=null; openEx=null;
  save(); stopRest(); keepAwake(false); render();

  $("#sheetIn").innerHTML = `<div class="grab"></div>
    <div style="text-align:center"><div style="font-size:36px">💪</div>
    <div style="font-weight:800;font-size:19px;margin-top:6px">${esc(dayName)} خلص</div></div>
    <div class="big3">
      <div><b class="num">${sets}</b><span>سِت</span></div>
      <div><b class="num">${Math.round(vol)}</b><span>كجم اترفعت</span></div>
      <div><b class="num">${mins}</b><span>دقيقة</span></div></div>
    ${prs.length?`<div class="sugg" style="margin-bottom:4px">🔥 أرقام شخصية جديدة:
      <b>${prs.map(esc).join("، ")}</b></div>`:""}
    <button class="btn main" onclick="document.getElementById('sheet').classList.remove('on')">تمام</button>`;
  $("#sheet").classList.add("on");
}
function cancelWorkout(){
  if(!confirm("هيتلغي التمرين ده من غير حفظ. متأكد؟")) return;
  live=null; openEx=null; save(); stopRest(); keepAwake(false); render();
}
function delSession(id){
  if(!confirm("امسح التمرين ده من السجل؟")) return;
  sessions=sessions.filter(s=>s.id!==id); save(); renderHistory();
}

$("#sheet").onclick = e => { if(e.target.id==="sheet") $("#sheet").classList.remove("on"); };
$("#backBtn").onclick = () => { if(live && confirm("ترجع من غير ما تحفظ التمرين؟")){
  live=null; save(); stopRest(); keepAwake(false); render(); } };
$("#finishBtn").onclick = finishWorkout;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.pg));

/* تسجيل الـ service worker — بيخلي التطبيق يفتح من غير نت */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

if(live) keepAwake(true);
render();
</script>
</body>
</html>
